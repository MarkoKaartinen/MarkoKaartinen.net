{{ define "main" }}
<article class="max-w-3xl">
  <h1 class="font-mono font-bold text-3xl mb-8"><span class="text-overlay0 select-none"># </span>{{ .Title }}</h1>
  <div class="sisalto">{{ .Content }}</div>

  {{- range hugo.Data.linkit.groups }}
  <section class="mt-10">
    <h2 class="font-mono font-bold text-xl mb-4"><span class="text-overlay0 select-none">## </span>{{ .title }}</h2>
    <ul class="flex flex-wrap gap-3">
      {{- range .links }}
      <li>
        <a href="{{ .url }}" {{ with .rel }}rel="{{ . }}"{{ else }}rel="noopener"{{ end }} class="inline-flex items-center gap-2 rounded border border-surface1 bg-mantle px-3 py-1.5 font-mono text-sm text-text hover:border-mauve hover:text-mauve">
          <span class="text-overlay1">{{ partial "icon.html" (dict "name" .icon "class" "size-4") }}</span>{{ .name }}
        </a>
      </li>
      {{- end }}
    </ul>
  </section>
  {{- end }}
</article>
{{ end }}
