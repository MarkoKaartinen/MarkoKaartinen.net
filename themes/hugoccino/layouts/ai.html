{{ define "main" }}
<article>
  <h1 class="font-mono font-bold text-[2.1rem] sm:text-4xl wrap-break-word leading-tight mb-8"><span class="text-overlay0 select-none"># </span>{{ .Title }}</h1>
  <div class="sisalto">
    {{ .Content }}
    <ul>
      {{- range hugo.Data.vouches.vouches }}
      <li><a href="{{ .url }}" rel="noopener noreferrer" target="_blank">{{ (urls.Parse .url).Host | strings.TrimPrefix "www." }}</a> <small>({{ .vouched_at }})</small></li>
      {{- end }}
    </ul>
  </div>
</article>
{{ end }}
