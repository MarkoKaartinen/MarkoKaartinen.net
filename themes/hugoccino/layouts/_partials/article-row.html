<li class="py-2 flex flex-col sm:flex-row sm:items-baseline gap-x-4">
  <time datetime="{{ .Date.Format "2006-01-02" }}" class="font-mono text-sm text-overlay1 shrink-0">{{ .Date.Format "2006-01-02" }}</time>
  <span class="min-w-0">
    <a href="{{ .RelPermalink }}" class="text-text hover:text-mauve">{{ .Title }}</a>
    {{- with .GetTerms "tags" }}
    <span class="ml-2 font-mono text-xs text-overlay1">
      {{- range first 3 . }}<span class="mr-1">#{{ lower .LinkTitle }}</span>{{ end -}}
    </span>
    {{- end }}
  </span>
</li>
