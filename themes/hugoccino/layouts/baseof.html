<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body class="min-h-screen flex flex-col bg-base text-text font-sans antialiased">
  {{- partial "header.html" . -}}
  <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-10">
    {{- block "main" . }}{{ end -}}
  </main>
  {{- partial "footer.html" . -}}
  {{- partial "palette.html" . -}}
  <button type="button" id="to-top" hidden aria-label="Takaisin ylös" title="Takaisin ylös"><svg class="to-top-ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="to-top-bar" cx="22" cy="22" r="21" pathLength="100"/></svg>{{ partial "icon.html" (dict "name" "lucide/arrow-up" "class" "size-5") }}</button>
</body>
</html>
