{{ define "main" }}
<article>
  <h1 class="font-mono font-bold text-[2.1rem] sm:text-4xl break-words leading-tight mb-6"><span class="text-overlay0 select-none"># </span>{{ .Title }}</h1>
  <div class="sisalto">{{ .Content }}</div>

  <div id="haku" data-pagefind="{{ "pagefind/pagefind.js" | relURL }}" class="mt-8 font-mono text-sm">
    <label class="flex items-center gap-2 rounded-lg border border-surface1 bg-mantle px-3 py-2 focus-within:border-mauve">
      <span class="text-green select-none" aria-hidden="true">$</span>
      <span class="text-meta select-none">grep -ri</span>
      <input type="search" data-q autocomplete="off" spellcheck="false" autofocus placeholder="hae artikkelien tekstistä" aria-label="Hae artikkelien tekstistä" class="min-w-0 flex-1 bg-transparent text-text outline-none placeholder:text-overlay0">
    </label>
    <div data-filters hidden class="mt-3 flex flex-wrap gap-2"></div>
    <p data-status class="mt-4 text-meta" aria-live="polite"></p>
    <ol data-results class="mt-2 divide-y divide-surface0"></ol>
    <p class="mt-4"><button type="button" data-more hidden class="rounded border border-surface1 bg-mantle px-3 py-1.5 text-subtext0 hover:border-mauve hover:text-mauve">näytä lisää</button></p>
  </div>
  <noscript><p class="mt-4 font-mono text-sm text-subtext0">Haku vaatii JavaScriptin. Selaa artikkeleita <a href="{{ "/blogi" | relURL }}" class="text-blue">blogin arkistosta</a>.</p></noscript>
</article>
{{- $js := resources.Get "js/haku.js" | resources.Minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
{{ end }}
