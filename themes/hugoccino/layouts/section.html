{{ define "main" }}
<h1 class="font-mono font-bold text-[2.1rem] sm:text-4xl wrap-break-word leading-tight mb-8"><span class="text-overlay0 select-none"># </span>{{ .Title }}</h1>
{{- with .Content }}<div class="sisalto mb-10">{{ . }}</div>{{ end }}
<ul class="divide-y divide-surface0">
  {{- range .Pages }}
    {{ partial "article-row.html" . }}
  {{- end }}
</ul>
{{ end }}
