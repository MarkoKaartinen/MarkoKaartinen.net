baseURL = 'https://markokaartinen.net/'
title = 'MarkoKaartinen.net'
enableRobotsTXT = true
locale = 'fi'
defaultContentLanguage = 'fi'
theme = 'hugoccino'
removePathAccents = true
timeZone = 'Europe/Helsinki'

[params]
  author = 'Marko Kaartinen'
  description = 'MarkoKaartinen.net on yhden nörtin projekti ja sisältää sekalaista settiä niin tekniikasta kuin muusta nörtteilystä.'

  # Tämän sivuston lähdekoodi (näkyy alatunnisteessa)
  repo = 'https://github.com/MarkoKaartinen/MarkoKaartinen.net'

  # Mastodon-syöte etusivulla haetaan selaimessa tilin julkisesta API:sta
  [params.mastodon]
    instance = 'https://kaartinen.social'
    account = '114940898154555398'
    profile = 'https://kaartinen.social/@marko'
    handle = '@marko@kaartinen.social'
    limit = 6

  # Kävijälaskuri: placeholder-luku, kunnes API on valmis. Aseta api-osoite, niin luku haetaan sieltä (JSON: {"visits": 123})
  [params.visitors]
    placeholder = 123456
    api = ''

  # Plausible: nginx proxyttaa polut <proxy>/script.js ja <proxy>/event (ks. README). Tyhjä = ei skriptiä. Vain tuotantokoonnissa.
  [params.plausible]
    proxy = '/plau'

  [[params.social]]
    name = 'Mastodon'
    icon = 'simple/mastodon'
    url = 'https://kaartinen.social/@marko'
    rel = 'me'

# Osoitteet: /kategoria/{slug}, /avainsana/{slug}, /sarja/{slug} ja listaukset
[taxonomies]
  category = 'categories'
  tag = 'tags'
  serie = 'series'
  recipe_category = 'recipe_categories'
  recipe_tag = 'recipe_tags'

[permalinks.taxonomy]
  categories = '/kategoriat/'
  tags = '/avainsanat/'
  series = '/sarjat/'
  recipe_categories = '/reseptit/kategoriat/'
  recipe_tags = '/reseptit/avainsanat/'

[permalinks.term]
  categories = '/kategoria/:slug/'
  tags = '/avainsana/:slug/'
  series = '/sarja/:slug/'
  recipe_categories = '/reseptit/kategoria/:slug/'
  recipe_tags = '/reseptit/avainsana/:slug/'

# Vuosikansioissa olevat sisällöt ovat artikkeleita
[[cascade]]
  type = 'artikkeli'
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = '/20*/**'

# Reseptien kuvat julkaistaan vain pienennettyinä
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = '/resepti/**'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    typographer = false
    [markup.goldmark.extensions.extras.mark]
      enable = true
  [markup.goldmark.parser.attribute]
    block = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    lineNumbersInTable = false

# Etusivun JSON-indeksi (/index.json) ruokkii haku- ja komentopalettia
# RSS vain etusivulle (kaikki) sekä /blogi ja /reseptit (front matter); termeille ja vuosille ei omia syötteitä
[outputs]
  home = ['html', 'rss', 'json', 'humanjson', 'smsivut', 'smartikkelit', 'smreseptit', 'smavainsanat', 'smkategoriat', 'smsarjat', 'smreseptiluokat', 'vanhafeed']
  section = ['html']
  taxonomy = ['html']
  term = ['html']

# Sivukartan osat (sitemap.xml on hakemisto, ks. layouts/sitemap.xml)
[outputFormats.smsivut]
  mediaType = 'application/xml'
  baseName = 'sitemap-sivut'
  isPlainText = true
  notAlternative = true

[outputFormats.smartikkelit]
  mediaType = 'application/xml'
  baseName = 'sitemap-artikkelit'
  isPlainText = true
  notAlternative = true

[outputFormats.smreseptit]
  mediaType = 'application/xml'
  baseName = 'sitemap-reseptit'
  isPlainText = true
  notAlternative = true

[outputFormats.smavainsanat]
  mediaType = 'application/xml'
  baseName = 'sitemap-avainsanat'
  isPlainText = true
  notAlternative = true

[outputFormats.smkategoriat]
  mediaType = 'application/xml'
  baseName = 'sitemap-kategoriat'
  isPlainText = true
  notAlternative = true

[outputFormats.smsarjat]
  mediaType = 'application/xml'
  baseName = 'sitemap-sarjat'
  isPlainText = true
  notAlternative = true

[outputFormats.smreseptiluokat]
  mediaType = 'application/xml'
  baseName = 'sitemap-reseptiluokat'
  isPlainText = true
  notAlternative = true

[mediaTypes.'application/x-vanhafeed']
  suffixes = ['']

[outputFormats.vanhafeed]
  mediaType = 'application/x-vanhafeed'
  baseName = 'feed'
  isPlainText = true
  notAlternative = true

# RSS-syötteen tiedostonimi: feed.xml (index.xml:n sijaan)
[outputFormats.rss]
  baseName = 'feed'

# /human.json (https://codeberg.org/robida/human.json)
[outputFormats.humanjson]
  mediaType = 'application/json'
  baseName = 'human'
  isPlainText = true
  notAlternative = true

# Päävalikko ja "lisää"-valikko, samat sivut kuin nykyisellä sivustolla
[[menus.main]]
  name = 'blogi'
  url = '/blogi'
  weight = 10
[[menus.main]]
  name = 'selaa'
  url = '/selaa'
  weight = 15
[[menus.main]]
  name = 'vieraskirja'
  url = '/vieraskirja'
  weight = 20
[[menus.main]]
  name = 'linkit'
  url = '/linkit'
  weight = 30
[[menus.main]]
  name = 'reseptit'
  url = '/reseptit'
  weight = 40
[[menus.main]]
  name = 'haku'
  url = '/haku'
  weight = 50

[[menus.more]]
  name = 'pelihaaste'
  url = '/pelihaaste'
  weight = 10
[[menus.more]]
  name = 'nyt'
  url = '/nyt'
  weight = 20
[[menus.more]]
  name = 'tietoa'
  url = '/tietoa'
  weight = 30
[[menus.more]]
  name = 'ai'
  url = '/ai'
  weight = 40
[[menus.more]]
  name = 'kahvilaskuri'
  url = '/kahvilaskuri'
  weight = 50

# Upotukset: YouTube youtube-nocookie.com-osoitteen kautta, Vimeo Do Not Track
[privacy]
  [privacy.youtube]
    privacyEnhanced = true
  [privacy.vimeo]
    enableDNT = true

# Hugo saa ajaa Tailwindin
[security.exec]
  allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

# Tailwind: Hugo kertoo käytetyt luokat tiedostossa hugo_stats.json
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  # Templatemuutos tyhjentää CSS-välimuistin heti, jotta uudet Tailwind-luokat näkyvät kehityspalvelimessa ilman uudelleenkäynnistystä
  [[build.cachebusters]]
    source = 'layouts/.*'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[related]
  includeNewer = true
  threshold = 30
  toLower = true
  [[related.indices]]
    name = 'series'
    weight = 100
  [[related.indices]]
    name = 'tags'
    weight = 80
  [[related.indices]]
    name = 'categories'
    weight = 40
  [[related.indices]]
    name = 'recipe_tags'
    weight = 80
  [[related.indices]]
    name = 'recipe_categories'
    weight = 40
